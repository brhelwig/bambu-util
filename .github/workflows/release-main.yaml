name: release-main

# Every commit that lands on main and passes ci is released. Versions are
# calendar-based, vYY.DOY.MMMM: year, day of the year and minute of the day, in
# UTC. It waits on ci rather than the push itself because release.yaml retags
# the image ci built for that commit, which only exists once ci has finished.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# One at a time, so two merges close together cannot pick the same version.
concurrency:
  group: release-main

permissions:
  contents: write
  packages: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Pick the next version and tag the commit
        id: next
        run: |
          # A rerun must not release the same commit twice.
          if git tag --points-at "$SHA" | grep -q '^v'; then
            echo "$SHA is already released"
            exit 0
          fi
          # Year, day of year and minute of the day, all UTC and unpadded: a
          # commit at 15:07 UTC on 6 October 2026 is v26.279.907. The `10#`
          # keeps 08 and 09 from being read as octal.
          now=$(date -u +'%y %-j %H %M')
          set -- $now
          tag="v$1.$2.$((10#$3 * 60 + 10#$4))"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
      packages: write
