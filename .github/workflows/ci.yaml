name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/brhelwig/bambu-util
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain rust-toolchain.toml names on first use.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: .github/scripts/check-rust-version.sh
      - run: cargo test --locked

  cross-compile:
    # The same script release.yaml runs, so a target that stops building fails
    # here rather than at release time. macOS builds need Apple's SDK, so they
    # run on macOS; everything else cross-compiles from Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-latest }
          - { platform: windows/amd64, runner: ubuntu-latest }
          - { platform: windows/arm64, runner: ubuntu-latest }
          - { platform: darwin/amd64, runner: macos-latest }
          - { platform: darwin/arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - if: runner.os == 'Linux'
        run: pip install -r .github/zigbuild/requirements.txt
      - run: .github/scripts/build-dist.sh ci "$RUNNER_TEMP/dist" ${{ matrix.platform }}

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('.github/scripts/check-js.sh') }}
      - run: .github/scripts/check-js.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built on every pull request so a broken Dockerfile fails there rather
      # than after it reaches main; only a push to main publishes the result.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/brhelwig/bambu-util
