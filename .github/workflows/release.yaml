name: release
on:
  # A tag pushed by hand.
  push:
    tags: ["v*"]
  # Called by release-main.yaml for the tag it cuts after each merge. A tag
  # pushed with the workflow token does not start workflows, so that one is
  # called directly rather than relying on the trigger above.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  SHA: ${{ inputs.sha || github.sha }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${platform%/*}
            goarch=${platform#*/}
            bin=bambu-util
            [ "$goos" = "windows" ] && bin=bambu-util.exe
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -ldflags="-s -w" -o "$bin" ./cmd/bambu-util
            name="bambu-util_${TAG}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              zip -q "dist/${name}.zip" "$bin" README.md LICENSE
            else
              tar -czf "dist/${name}.tar.gz" "$bin" README.md LICENSE
            fi
            rm "$bin"
          done
          (cd dist && sha256sum -- * > checksums.txt)
      - name: Extract changelog section
        run: |
          # Every merge is released, so the version's own section does not
          # exist yet: the notes are whatever is under Unreleased.
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## \\[Unreleased\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --verify-tag \
            --notes-file release-notes.md

  # A v* tag always points at a commit that already went through the main-branch
  # image job, so the released version is a new name for that exact manifest
  # rather than a rebuild. Rebuilding would silently pick up whatever golang and
  # distroless base images have moved to since, shipping something other than
  # what CI tested.
  image-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the CI-built image with the release version
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/brhelwig/bambu-util:${TAG}" \
            "ghcr.io/brhelwig/bambu-util:${SHA}"
