name: release

# Every commit that lands on main and passes ci is released, versioned
# YY.DOY.M (year, day of year, minute of day, UTC; see the tag step). It waits
# on ci because the image is not rebuilt here: the one ci built for that commit
# is given the version as a tag.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# One at a time, so two merges close together cannot pick the same version.
concurrency:
  group: release

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/brhelwig/bambu-util
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Pick the next version and tag the commit
        id: next
        run: |
          # A rerun must not release the same commit twice.
          if git tag --points-at "$SHA" | grep -q '^[0-9]'; then
            echo "$SHA is already released"
            exit 0
          fi
          # Year, day of year and minute of the day, all UTC and unpadded: a
          # commit at 15:07 UTC on 6 October 2026 is 26.279.907. The `10#`
          # keeps 08 and 09 from being read as octal.
          now=$(date -u +'%y %-j %H %M')
          set -- $now
          tag="$1.$2.$((10#$3 * 60 + 10#$4))"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          git tag "$tag" "$SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Each platform builds on a runner that can build it (see build-dist.sh), and
  # one job gathers them into the release.
  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-latest }
          - { platform: windows/amd64, runner: ubuntu-latest }
          - { platform: windows/arm64, runner: ubuntu-latest }
          - { platform: darwin/amd64, runner: macos-latest }
          - { platform: darwin/arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - if: runner.os == 'Linux'
        run: pip install -r .github/zigbuild/requirements.txt
      - run: .github/scripts/build-dist.sh "$TAG" dist ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ strategy.job-index }}
          path: dist/*

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: .github/scripts/build-dist.sh checksums dist
      # The notes list the pull requests merged since the previous release,
      # grouped by .github/release.yml.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --verify-tag \
            --generate-notes

  # The released version is a new name for the exact manifest ci built and
  # tested for this commit, not a rebuild. Rebuilding would silently pick up
  # whatever rust and distroless base images have moved to since.
  image-tag:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the CI-built image with the release version
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ needs.tag.outputs.tag }}" \
            "$IMAGE:$SHA"
